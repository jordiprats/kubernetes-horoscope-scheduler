{{- if .Values.rbac.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "horoscope-scheduler.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "horoscope-scheduler.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "horoscope-scheduler.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "horoscope-scheduler.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/binding"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "horoscope-scheduler.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "horoscope-scheduler.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "horoscope-scheduler.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "horoscope-scheduler.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
{{- end -}}
