apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "horoscope-scheduler.fullname" . }}-script
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "horoscope-scheduler.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  scheduler.sh: |
{{ .Files.Get "scripts/scheduler.sh" | indent 4 }}
